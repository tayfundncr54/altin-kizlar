<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altın Kızlar Jersey Süt Çiftliği</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--g:#0b4d2a;--bg:#fff;--fg:#111;--mut:#666}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.ann{background:var(--g);color:#fff;text-align:center;font-weight:700;font-size:13px;padding:10px 16px}
header{padding:22px 16px 10px;text-align:center}header h1{margin:0;color:var(--g);font-size:30px}header p{margin:4px 0 0;color:var(--mut)}
#map{height:62vh;margin:0 16px;border-radius:12px;border:1px solid #ddd}
.st{max-width:760px;margin:14px auto;padding:0 16px;font-size:14px;line-height:1.7;color:var(--mut)}
.ok{color:var(--g);font-weight:700}.no{color:#b3412d;font-weight:700}
</style>
</head>
<body>
<div class="ann">Altın Kızlar Jersey Süt Çiftliği · Kurulum aşamasında</div>
<header><h1>Altın Kızlar</h1><p>Jersey Süt Çiftliği · Söğütlü, Sakarya</p></header>
<div id="map"></div>
<div class="st" id="st">Harita deneniyor…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var out=[];function log(t){out.push(t);document.getElementById("st").innerHTML=out.join("<br>")}
var map=L.map("map").setView([40.78,30.40],12),n=0;
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).on("tileload",function(){if(!n++)log('<span class="ok">✓ Sokak haritası çalışıyor</span>')}).addTo(map);
L.marker([40.905,30.474]).addTo(map).bindPopup("Altın Kızlar Çiftliği");
fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent("Maltepe Mahallesi, Adapazarı, Sakarya")).then(function(r){return r.json()}).then(function(j){if(j[0]){log('<span class="ok">✓ Adresten konum bulma çalışıyor</span> (Maltepe Mahallesi bulundu)');L.circleMarker([+j[0].lat,+j[0].lon],{radius:8}).addTo(map).bindPopup("Maltepe Mahallesi")}else log("Adresten konum: sonuç yok")}).catch(function(){log('<span class="no">✗ Adresten konum bulma çalışmadı</span>')});
document.getElementById("map").insertAdjacentHTML("afterend",'<div class="st"><button id="gp" style="font:inherit;font-weight:700;background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 16px">📍 Telefonun konumunu dene</button></div>');
document.getElementById("gp").onclick=function(){if(!navigator.geolocation){log('<span class="no">✗ Konum desteklenmiyor</span>');return}navigator.geolocation.getCurrentPosition(function(p){log('<span class="ok">✓ Telefon konumu çalışıyor</span>');L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup("Buradasınız").openPopup();map.setView([p.coords.latitude,p.coords.longitude],15)},function(e){log('<span class="no">✗ Konum alınamadı: '+e.message+'</span>')},{enableHighAccuracy:true,timeout:15000})};
</script>
</body>
</html>
